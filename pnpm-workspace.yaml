allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  electron-winstaller: false
  esbuild: true
  unrs-resolver: false

# Disable pnpm's side-effects cache for dependencies.
#
# When sideEffectsCache is enabled, pnpm caches the post-install artifacts of packages (e.g. compiled
# native modules) and restores them on subsequent installs, which speeds things up but ties the cached
# binaries to the Node.js version that produced them.
#
# Native modules built against N-API (e.g. better-sqlite3 v13+) ship prebuilt binaries that are
# ABI-stable across Node.js and Electron versions, so the cache is safe for them. However, if a
# non-N-API native module (one that links against V8's C++ API) is ever added, its binaries are
# runtime-specific and the cache could serve stale builds. In that case, uncomment the line below
# and add a backup step to postinstall:
#
#   "postinstall": "node ./scripts/backup-native-node-modules.mjs && electron-builder install-app-deps"
#
# sideEffectsCache: false
