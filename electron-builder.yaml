appId: com.yifanwww.template-electron-react
productName: Template Electron React
directories:
  output: release/${version}
artifactName: ${name}-${version}-${arch}.${ext}
files:
  - out/**
  - package.json
# extraResources:
#   - from: resources/something
#     to: something
win:
  target:
    - target: nsis
      arch: x64
  # icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # installerIcon: build/icon.ico
  # uninstallerIcon: build/icon.ico
mac:
  target: dmg
  category: public.app-category.developer-tools
  # icon: build/icon.icns
